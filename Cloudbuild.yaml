steps:
  # Step 1: Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/quantapp-backend:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/quantapp-backend:latest'
      - './backend'

  # Step 2: Push the image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/quantapp-backend:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/quantapp-backend:latest'

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'quantapp-backend'
      - '--image=gcr.io/$PROJECT_ID/quantapp-backend:$COMMIT_SHA'
      - '--platform=managed'
      - '--region=us-central1'
      - '--allow-unauthenticated'
      - '--memory=1Gi'
      - '--timeout=120'

# Store the built image
images:
  - 'gcr.io/$PROJECT_ID/quantapp-backend:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/quantapp-backend:latest'
